<!--
title: Which one are you? — Alf Maskan
desc: Individual agent, brokerage, developer or property manager.
bodyClass: app
css: dashboard, app, editor, onboard
js: onboard
theme: yes
step: 2
-->
<div class="ob">
  {{> onboard-rail}}
  <div class="obody">

    <div class="ohead">
      <span class="ohead__eyebrow">Step 2 of 8</span>
      <h1>Which one are you?</h1>
      <p>It changes what we set up by default. Nothing here is locked — you can switch later without losing anything.</p>
    </div>

    <div class="choices" role="radiogroup" aria-label="Kind of business">
      <label class="choice">
        <input type="radio" name="kind" value="agent" checked>
        <span class="choice__tick" aria-hidden="true">{{> tick}}</span>
        <span class="choice__mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 17a6.5 6.5 0 0113 0" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <b>Individual agent</b>
        <span>Your own storefront with your photo and your number. No team, no roles to set up.</span>
      </label>

      <label class="choice">
        <input type="radio" name="kind" value="agency">
        <span class="choice__tick" aria-hidden="true">{{> tick}}</span>
        <span class="choice__mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="7" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="14.5" cy="7.5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 16a5.5 5.5 0 0111 0M13 12.5a4.5 4.5 0 015.5 3.5" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <b>Brokerage or agency</b>
        <span>Agents get their own leads and see only their own pipeline. You see everything.</span>
      </label>

      <label class="choice">
        <input type="radio" name="kind" value="developer">
        <span class="choice__tick" aria-hidden="true">{{> tick}}</span>
        <span class="choice__mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 18V7l7-4.5L16 7v11" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 18h16M7 18v-5h4v5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
        <b>Developer</b>
        <span>Projects and phases rather than loose units, with a masterplan page for each compound.</span>
      </label>

      <label class="choice">
        <input type="radio" name="kind" value="manager">
        <span class="choice__tick" aria-hidden="true">{{> tick}}</span>
        <span class="choice__mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h16M6.5 2v4M13.5 2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        <b>Property manager</b>
        <span>Rentals first: availability calendars, monthly pricing and available-from dates.</span>
      </label>
    </div>

    <div class="ofoot">
      <a class="ofoot__skip" href="{{base}}onboarding/language.html">
        <svg class="flip" width="12" height="10" viewBox="0 0 12 10" fill="none" aria-hidden="true" style="vertical-align:-1px"><path d="M5 1L1 5l4 4M1 5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
      <span class="ofoot__end">
        <a class="btn btn--go" href="{{base}}onboarding/business.html">Continue</a>
      </span>
    </div>
  </div>
</div>
